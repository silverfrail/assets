
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stream Output</title>
<style>
body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }

#canvas-wrapper {
  position: absolute;
  width: 1080px;
  height: 1920px;
  transform-origin: top left;
}

/* Styled Launch Screen for Mobile Tap */
#audio-launch-screen {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: rgba(17, 17, 17, 0.95);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 999999;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  transition: opacity 0.2s;
}

.launch-btn {
  background: #111;
  border: 2px solid #5CFF5C;
  color: #5CFF5C;
  font-family: Arial, sans-serif;
  font-size: 22px;
  font-weight: bold;
  padding: 20px 40px;
  border-radius: 8px;
  box-shadow: 0 0 25px rgba(0, 0, 255, 0.6);
  text-transform: uppercase;
  letter-spacing: 2px;
  text-align: center;
}
.launch-subtext {
  font-size: 14px;
  color: #aaa;
  margin-top: 10px;
  font-weight: normal;
  letter-spacing: normal;
  text-transform: none;
}
</style>
</head>
<body>

<div id="audio-launch-screen">
  <div class="launch-btn">
    Tap to Connect
    <div class="launch-subtext">(Required for iOS/Mobile Audio)</div>
  </div>
</div>

<div id="canvas-wrapper">
  
      <iframe id="overlay_1" src="https://throne.com/stream-alerts/A9SKjejzY2NrfhCDivvLGWo3nAT2" 
              allow="autoplay; encrypted-media; microphone; picture-in-picture;"
              allowfullscreen
              style="position: absolute; border: none; background: transparent; transform-origin: top left;
                     width: 1080px; height: 1920px;
                     top: 0px; left: 0px; z-index: 10;
                     transform: scale(1.0000);
                     clip-path: inset(0px 0px 0px 0px);
                     pointer-events: auto;">
      </iframe>
</div>

<script>
// Embedded Data Payload for Re-importing
const OVERLAY_DATA = [{"id":"overlay_1","url":"https://throne.com/stream-alerts/A9SKjejzY2NrfhCDivvLGWo3nAT2","x":0,"y":0,"scale":1,"crop":{"t":0,"r":0,"b":0,"l":0},"interactive":true,"zIndex":10}];
const canvasWidth = 1080;
const canvasHeight = 1920;

function resizeCanvas() {
  const wrapper = document.getElementById('canvas-wrapper');
  const scaleX = window.innerWidth / canvasWidth;
  const scaleY = window.innerHeight / canvasHeight;
  const scale = Math.min(scaleX, scaleY);
  
  const scaledWidth = canvasWidth * scale;
  const scaledHeight = canvasHeight * scale;
  const leftOffset = Math.max(0, (window.innerWidth - scaledWidth) / 2);
  const topOffset = Math.max(0, (window.innerHeight - scaledHeight) / 2);

  wrapper.style.transform = 'translate(' + leftOffset + 'px, ' + topOffset + 'px) scale(' + scale + ')';
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ==========================================
// PRE-LOAD AND COVER ENGINE
// ==========================================
const launchScreen = document.getElementById('audio-launch-screen');

if (launchScreen) {
  launchScreen.addEventListener('click', function() {
    
    // 1. Hide the blocker
    this.style.opacity = '0';
    setTimeout(() => { this.style.display = 'none'; }, 200);

    // 2. Force the global audio context just in case
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) {
      try {
        const audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const oscillator = audioCtx.createOscillator();
        oscillator.connect(audioCtx.destination);
        oscillator.start(0);
        oscillator.stop(0.001);
      } catch(e) { console.error("Audio Context Force failed", e); }
    }

    // 3. Hand off the interaction token by firing focus and postMessage into the iframes
    const allIframes = document.querySelectorAll('iframe');
    allIframes.forEach(iframe => {
      try {
        iframe.contentWindow.postMessage('unlock', '*');
        iframe.focus();
      } catch (e) {
        console.error("Could not pass focus token to iframe:", e);
      }
    });

  });
}
</script>
</body>
</html>
