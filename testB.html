<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blerp Mobile Overlay</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: sans-serif;
            text-align: center;
            overflow: hidden;
        }
        #overlay-container {
            width: 100vw;
            height: 100vh;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #click-to-start {
            position: absolute;
            z-index: 100;
            cursor: pointer;
            padding: 40px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #fff;
            border-radius: 15px;
            user-select: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div id="click-to-start">
        <h1>Blerp Overlay</h1>
        <p>Tap here to activate audio for your stream</p>
    </div>

    <div id="overlay-container">
        <iframe 
            id="blerp-iframe" 
            src="https://obs.blerp.com/pwn/dhtiuvmk_hzz" 
            allow="autoplay; camera; microphone; midi; encrypted-media;" 
            allowtransparency="true">
        </iframe>
    </div>

    <script>
        const starter = document.getElementById('click-to-start');
        
        starter.addEventListener('click', function() {
            // Remove the overlay
            this.style.display = 'none';
            
            // Force focus on the iframe to ensure it catches the audio unlock
            const iframe = document.getElementById('blerp-iframe');
            iframe.contentWindow.focus();
        });
    </script>

</body>
</html>
