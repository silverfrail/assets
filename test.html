
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
body { margin: 0; padding: 0; background: transparent; overflow: hidden; background-color: transparent; }
#canvas-wrapper {
  position: absolute;
  width: 1080px;
  height: 1920px;
  transform-origin: top left;
}
iframe { position: absolute; border: none; background: transparent; }
#overlay1 {
      width: 1080px; height: 1920px;
      top: 0px; left: 0px;
      z-index: 10;
      transform: scale(1.0000);
      transform-origin: top left;
      clip-path: inset(0px 0px 0px 0px);
    }


/* The Invisible Audio Handshake Overlay */
#audio-launch-screen {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: rgba(0, 0, 0, 0.7);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  font-size: 24px;
  font-weight: bold;
  z-index: 999999;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  transition: opacity 0.3s;
}
</style>
</head>
<body>

<div id="audio-launch-screen">Tap Anywhere to Start Audio</div>

<div id="canvas-wrapper">
<iframe id="overlay1" src="https://obs.blerp.com/pwn/dhtiuvmk_hzz" allow="autoplay; camera; microphone; picture-in-picture;"></iframe>

</div>
<script>
function resizeCanvas() {
  const wrapper = document.getElementById('canvas-wrapper');
  const cw = 1080;
  const ch = 1920;
  
  const scaleX = window.innerWidth / cw;
  const scaleY = window.innerHeight / ch;
  
  // Fit to screen layout
  const scale = Math.min(scaleX, scaleY);
  const scaledWidth = cw * scale;
  const scaledHeight = ch * scale;
  
  // Center it
  const leftOffset = Math.max(0, (window.innerWidth - scaledWidth) / 2);
  const topOffset = Math.max(0, (window.innerHeight - scaledHeight) / 2);

  wrapper.style.transform = 'translate(' + leftOffset + 'px, ' + topOffset + 'px) scale(' + scale + ')';
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ==========================================
// MASTER AUDIO GATE CONTROLLER
// ==========================================
const launchScreen = document.getElementById('audio-launch-screen');

if (launchScreen) {
  launchScreen.addEventListener('click', () => {
    // 1. Force the hardware audio route open
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) {
      const audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      // Generate a micro-second of silence to fully activate iOS/Android speakers
      const oscillator = audioCtx.createOscillator();
      oscillator.connect(audioCtx.destination);
      oscillator.start(0);
      oscillator.stop(0.001);
    }

    // 2. Hide the launch screen permanently for this session
    launchScreen.style.opacity = '0';
    setTimeout(() => {
      launchScreen.style.display = 'none';
    }, 300);
  });
}
</script>
</body>
</html>
