
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
body { margin: 0; padding: 0; background: transparent; overflow: hidden; background-color: transparent; }
#canvas-wrapper {
  position: absolute;
  width: 1080px;
  height: 1920px;
  transform-origin: top left;
}
iframe { position: absolute; border: none; background: transparent; }
#overlay1 {
        width: 1080px; height: 1920px;
        top: 0px; left: 0px;
        z-index: 10;
        transform: scale(1.0000);
        transform-origin: top left;
        clip-path: inset(0px 0px 0px 0px);
      }
#soundToggleWidget {
        position: absolute;
        top: 54px; left: 754px;
        width: 300px; height: 120px;
        z-index: 9999;
        background-color: #e53935; color: white;
        border: 2px solid #fff; border-radius: 8px;
        font-family: Arial, sans-serif; font-size: 36px; font-weight: bold;
        cursor: pointer; display: flex; align-items: center; justify-content: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        user-select: none; -webkit-user-select: none;
      }

</style>
</head>
<body>
<div id="canvas-wrapper">
<iframe id="overlay1" src="https://obs.blerp.com/pwn/dhtiuvmk_hzz" allow="autoplay; camera; microphone; picture-in-picture;"></iframe>
<div id="soundToggleWidget">SOUND OFF</div>

</div>
<script>
function resizeCanvas() {
  const wrapper = document.getElementById('canvas-wrapper');
  const cw = 1080;
  const ch = 1920;
  
  const scaleX = window.innerWidth / cw;
  const scaleY = window.innerHeight / ch;
  
  // Fit to screen layout
  const scale = Math.min(scaleX, scaleY);
  const scaledWidth = cw * scale;
  const scaledHeight = ch * scale;
  
  // Center it
  const leftOffset = Math.max(0, (window.innerWidth - scaledWidth) / 2);
  const topOffset = Math.max(0, (window.innerHeight - scaledHeight) / 2);

  wrapper.style.transform = 'translate(' + leftOffset + 'px, ' + topOffset + 'px) scale(' + scale + ')';
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ==========================================
// MASTER AUDIO GATE CONTROLLER
// ==========================================
let isSoundOn = false;
const toggleBtn = document.getElementById('soundToggleWidget');

if (toggleBtn) {
  toggleBtn.addEventListener('click', () => {
    isSoundOn = !isSoundOn;
    
    if (isSoundOn) {
      // 1. Visual Update
      toggleBtn.innerText = 'SOUND ON';
      toggleBtn.style.backgroundColor = '#5cff5c';
      toggleBtn.style.color = '#000';
      
      // 2. The Audio Handshake (Forces iOS/Android to unlock standard media channels)
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        const audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        // Generate a micro-second of silence to force hardware routing
        const oscillator = audioCtx.createOscillator();
        oscillator.connect(audioCtx.destination);
        oscillator.start(0);
        oscillator.stop(0.001);
      }

      // 3. Broadcast unmute command to any internal iframes that support standard messaging
      document.querySelectorAll('iframe').forEach(ifr => {
        ifr.contentWindow.postMessage(JSON.stringify({ method: 'unmute' }), '*');
        ifr.contentWindow.postMessage('unmute', '*');
      });
      
    } else {
      // 1. Visual Update
      toggleBtn.innerText = 'SOUND OFF';
      toggleBtn.style.backgroundColor = '#e53935';
      toggleBtn.style.color = '#fff';
      
      // 2. Broadcast mute command
      document.querySelectorAll('iframe').forEach(ifr => {
        ifr.contentWindow.postMessage(JSON.stringify({ method: 'mute' }), '*');
        ifr.contentWindow.postMessage('mute', '*');
      });
    }
  });
}
</script>
</body>
</html>
