<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blerp Mobile Overlay</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: sans-serif;
            text-align: center;
            overflow: hidden;
        }
        #overlay-container {
            width: 100vw;
            height: 100vh;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #click-to-start {
            position: absolute;
            z-index: 10;
            cursor: pointer;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #fff;
            border-radius: 10px;
            user-select: none;
        }
    </style>
</head>
<body>

    <div id="click-to-start">
        <h2>Tap screen to enable audio</h2>
    </div>

    <div id="overlay-container">
        <iframe 
            id="blerp-iframe" 
            src="https://obs.blerp.com/pwn/dhtiuvmk_hzz" 
            allow="autoplay; microphone *;" 
            allowtransparency="true">
        </iframe>
    </div>

    <script>
        document.getElementById('click-to-start').addEventListener('click', function() {
            this.style.display = 'none';
        });
    </script>

</body>
</html>
