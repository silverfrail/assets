#canvas-wrapper {

  height: 1920px;
  transform-origin: top left;
}

#audio-launch-screen {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: rgba(17, 17, 17, 0.95);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 999999;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  transition: opacity 0.2s;
}

.launch-btn {
  background: #111;
  border: 2px solid #5CFF5C;
  color: #5CFF5C;
  font-family: Arial, sans-serif;
  font-size: 22px;
  font-weight: bold;
  padding: 20px 40px;
  border-radius: 8px;
  box-shadow: 0 0 25px rgba(0, 255, 0, 0.6);
  text-transform: uppercase;
  letter-spacing: 2px;
  text-align: center;
}
.launch-subtext {
  font-size: 14px;
  color: #aaa;
  margin-top: 10px;
  font-weight: normal;
  letter-spacing: normal;
  text-transform: none;
}
</style>

const canvasWidth = 1080;
const canvasHeight = 1920;

function resizeCanvas() {
  const wrapper = document.getElementById('canvas-wrapper');
  const scaleX = window.innerWidth / canvasWidth;
  const scaleY = window.innerHeight / canvasHeight;
  const scale = Math.min(scaleX, scaleY);
  
  const scaledWidth = canvasWidth * scale;
  const scaledHeight = canvasHeight * scale;
  const leftOffset = Math.max(0, (window.innerWidth - scaledWidth) / 2);
  const topOffset = Math.max(0, (window.innerHeight - scaledHeight) / 2);

  wrapper.style.transform = 'translate(' + leftOffset + 'px, ' + topOffset + 'px) scale(' + scale + ')';
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const launchScreen = document.getElementById('audio-launch-screen');

if (launchScreen) {
  launchScreen.addEventListener('click', function() {
    
    this.style.opacity = '0';
    setTimeout(() => { this.style.display = 'none'; }, 200);

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) {
      try {
        const audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const oscillator = audioCtx.createOscillator();
        oscillator.connect(audioCtx.destination);
        oscillator.start(0);
        oscillator.stop(0.001);
      } catch(e) { console.error("Audio Context Force failed", e); }
    }

    const allIframes = document.querySelectorAll('iframe');
    allIframes.forEach(iframe => {
      try {
        iframe.contentWindow.postMessage('unlock', '*');
        iframe.focus();
      } catch (e) {
        console.error("Could not pass focus token to iframe:", e);
      }
    });
  });
}
