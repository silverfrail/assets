<script>
function resizeCanvas() {
  const wrapper = document.getElementById('canvas-wrapper');
  const cw = 1080;
  const ch = 1920;
  
  const scaleX = window.innerWidth / cw;
  const scaleY = window.innerHeight / ch;
  
  // Use Math.min to ensure the entire canvas always fits on screen without cropping
  const scale = Math.min(scaleX, scaleY);
  
  const scaledWidth = cw * scale;
  const scaledHeight = ch * scale;
  
  // Calculate offsets to center the wrapper if the screen is wider/taller than the layout aspect ratio
  const leftOffset = Math.max(0, (window.innerWidth - scaledWidth) / 2);
  const topOffset = Math.max(0, (window.innerHeight - scaledHeight) / 2);

  wrapper.style.transform = 'translate(' + leftOffset + 'px, ' + topOffset + 'px) scale(' + scale + ')';
}

window.addEventListener('resize', resizeCanvas);
// Run once on load to establish immediate centering
resizeCanvas();
</script>
