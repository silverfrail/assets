
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
body { margin: 0; padding: 0; background: transparent; overflow: hidden; background-color: transparent; }
#canvas-wrapper {
  position: absolute;
  width: 1080px;
  height: 1920px;
  transform-origin: top left;
}
iframe { position: absolute; border: none; background: transparent; }
#overlay1 {
      width: 1080px; height: 1920px;
      top: 0px; left: 216px;
      z-index: 10;
      transform: scale(0.6000);
      transform-origin: top left;
      clip-path: inset(0px 0px 0px 0px);
    }

</style>
</head>
<body>
<div id="canvas-wrapper">
<iframe id="overlay1" src="https://vdo.ninja/?password=123&push=TmfNACQ" allow="autoplay; camera; microphone; picture-in-picture;"></iframe>

</div>
<script>
function resizeCanvas() {
  const wrapper = document.getElementById('canvas-wrapper');
  const cw = 1080;
  const ch = 1920;
  
  const scaleX = window.innerWidth / cw;
  const scaleY = window.innerHeight / ch;
  
  // Use Math.min to ensure the entire canvas always fits on screen without cropping
  const scale = Math.min(scaleX, scaleY);
  
  const scaledWidth = cw * scale;
  const scaledHeight = ch * scale;
  
  // Calculate offsets to center the wrapper if the screen is wider/taller than the layout aspect ratio
  const leftOffset = Math.max(0, (window.innerWidth - scaledWidth) / 2);
  const topOffset = Math.max(0, (window.innerHeight - scaledHeight) / 2);

  wrapper.style.transform = 'translate(' + leftOffset + 'px, ' + topOffset + 'px) scale(' + scale + ')';
}

window.addEventListener('resize', resizeCanvas);
// Run once on load to establish immediate centering
resizeCanvas();
</script>
</body>
</html>
