<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blerp Mobile Audio</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #overlay-container {
            width: 100vw;
            height: 100vh;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #click-to-start {
            position: absolute;
            z-index: 100;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-family: sans-serif;
            text-align: center;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="click-to-start">
        <div>
            <h1>Tap to Enable Blerp Audio</h1>
            <p>(Required for iOS/Mobile Safari)</p>
        </div>
    </div>

    <div id="overlay-container">
        <iframe 
            id="blerp-iframe" 
            src="https://obs.blerp.com/pwn/dhtiuvmk_hzz" 
            allow="autoplay; encrypted-media; microphone;" 
            allowfullscreen>
        </iframe>
    </div>

    <script>
        const starter = document.getElementById('click-to-start');
        const iframe = document.getElementById('blerp-iframe');

        starter.addEventListener('click', function() {
            // Hide the blocker
            this.style.display = 'none';
            
            // Try to force the audio context by interacting with the iframe window
            try {
                iframe.contentWindow.postMessage('unlock', '*');
                iframe.focus();
            } catch (e) {
                console.error("Could not force audio:", e);
            }
        });
    </script>
</body>
</html>
