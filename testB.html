<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blerp Mobile Optimized</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #blerp-iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
        /* This overlay sits on top of the iframe to catch the first tap */
        #tap-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="tap-layer">
        <h1>TAP TO START BLERP</h1>
    </div>

    <iframe 
        id="blerp-iframe" 
        src="https://obs.blerp.com/pwn/dhtiuvmk_hzz" 
        allow="autoplay; encrypted-media; microphone; clipboard-write;" 
        allowfullscreen>
    </iframe>

    <script>
        const tapLayer = document.getElementById('tap-layer');
        const iframe = document.getElementById('blerp-iframe');

        tapLayer.addEventListener('click', function() {
            // Remove the visual overlay
            this.style.display = 'none';
            
            // Focus the iframe immediately after the tap
            iframe.focus();
            
            // Tell the browser we are now ready for media
            // Most modern browsers will accept this flow as a single interaction
        });
    </script>
</body>
</html>
